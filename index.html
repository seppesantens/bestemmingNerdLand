<!DOCTYPE html>
<html lang="nl">
<head>
    <title>Bestemming Nerdland</title>
    <meta property="og:description" content="Reisbestemmingen voor nerds." />
    <meta charset='utf-8'>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://unpkg.com/maplibre-gl@5.22.0/dist/maplibre-gl.js"></script>
	<link href="https://unpkg.com/maplibre-gl@5.22.0/dist/maplibre-gl.css" rel="stylesheet" />
	<script src="https://w.soundcloud.com/player/api.js"></script>
    <style>
        body { margin: 0; padding: 0; }
        html, body, #map { height: calc(100vh - 140px); }
        iframe { position:fixed; bottom:0;}
		.maplibregl-popup {
			max-width: 400px;
		}
    </style>
</head>
<body>
  <div id="map" aria-label="Wereldkaart met bestemmingen die besproken werden in de Nerdland podcast"></div>
  
  <script>
  	// helper function to load data with no-cache
	async function loadJSON(url) {
		const resp = await fetch(url, { cache: 'no-cache' });
		if (!resp.ok) {
			throw new Error(`HTTP ${resp.status} while fetching ${url}`);
		}
		return await resp.json();
	}
  
	function getLatestClip(clips){
	  let latest = clips[0];
	  for (const clip of clips){
	  	if (clip.EP_date > latest.EP_date){
	    	latest = clip;
	    }
	  }
	  return latest;
	}

	async function getWikiDataItem(WD_id, coordinates) {
	  const WikiData_url = "https://www.wikidata.org/wiki/Special:EntityData/" + WD_id + ".json";
	  
	  try {
		const response = await fetch(WikiData_url);
		if (!response.ok) {
			throw new Error(`HTTP ${response.status} while fetching ${WikiData_url}`);
		}
		const WikiDataItem = await response.json();
		
		const entities = WikiDataItem["entities"][WD_id];
		if (!entities || "missing" in entities) {
			throw new Error(`Geen Wikidata-item gevonden voor ${WD_id}`);
		}

		const label = entities["labels"]?.["nl"]?.["value"]
			?? entities["labels"]?.["en"]?.["value"]
			?? WD_id;
		const description = entities["descriptions"]?.["nl"]?.["value"]
			?? entities["descriptions"]?.["en"]?.["value"]
			?? "";

		let popupHTML = `<p><strong>${label}</strong><br>${description}`;

		// Check whether the Wikidata item has a Dutch Wikipedia page
		if (entities["sitelinks"]?.["nlwiki"]?.["url"]) {
			const WP_link = entities["sitelinks"]["nlwiki"]["url"];
			popupHTML += `<br><a href="${WP_link}" target="_blank">lees meer op Wikipedia</a>`;
		}

		popupHTML += "</p>";
		
		// Check whether the Wikidata item has an image (P18). If so, show it.
		if (entities["claims"]?.["P18"]?.[0]?.["mainsnak"]?.["datavalue"]?.["value"]) {
			const filename = entities["claims"]["P18"][0]["mainsnak"]["datavalue"]["value"];
			const imgURL = "https://commons.wikimedia.org/wiki/Special:FilePath/" + encodeURIComponent(filename.trim());
			popupHTML += `<img src="${imgURL}" width="100%">`;
		}

		new maplibregl.Popup()
			.setLngLat(coordinates)
			.setHTML(popupHTML)
			.addTo(map);
		} catch (error) {
		console.error("Fout bij ophalen Wikidata:", error);
		new maplibregl.Popup()
			.setLngLat(coordinates)
			.setHTML(`<p>Kon geen informatie ophalen voor <a href="https://www.wikidata.org/wiki/${WD_id}" target="_blank">${WD_id}</a>.</p>`)
			.addTo(map);
	  }
	}

    const map = new maplibregl.Map({
        container: 'map',
        style: 'https://api.maptiler.com/maps/openstreetmap/style.json?key=vF0AVssUoSv9vAZNgmOg',
        center: [0, 50],
        zoom: 1,
        maxBounds:[
			[-169, -80],
			[190, 85]
        ]
    });
	
	map.addControl(new maplibregl.GlobeControl(), 'top-right');
	map.on('style.load', () => {
        map.setProjection({
            type: 'globe', // Set projection to globe
        });		
    });
    
    map.on('load', async () => {
		// SoundCloud initialisatie
		var iframeElement = document.querySelector('iframe');
		var widget = SC.Widget(iframeElement);

		const SC_link = "https://api.soundcloud.com/tracks/2069232792";
		const SC_stfr = 7552500;

		widget.load(SC_link, {'visual':'true'});
		widget.bind(SC.Widget.Events.READY,function(){ //When player is ready, attach an event
			widget.seekTo(SC_stfr);
		});

		// Add an image to use as a custom marker
        const image = await map.loadImage('https://raw.githubusercontent.com/seppesantens/bestemmingNerdLand/refs/heads/main/NerdlandLogo.png');
        map.addImage('custom-marker', image.data);

		// load clips data
		const NRDLclips = await loadJSON('https://raw.githubusercontent.com/seppesantens/bestemmingNerdLand/refs/heads/main/NRDLclips.json');

		// Add a GeoJSON source
		map.addSource('places', {
			'type': 'geojson',
			'data': './NRDLplaces.geojson',  
			cluster: true,
			clusterMaxZoom: 9,
			clusterRadius: 25 // Radius of each cluster when clustering points			
		});

		// cluster layer
		map.addLayer({
            'id': 'clusters',
            'type': 'circle',
            'source': 'places',
            'filter': ['has', 'point_count'],
            'paint': {
                'circle-color': '#6a40d2',
				'circle-opacity': 0.6,
                'circle-radius': 23
            }
        });

		// cluster count layer
        map.addLayer({
            id: 'cluster-count',
            type: 'symbol',
            source: 'places',
            filter: ['has', 'point_count'],
            layout: {
                'text-field': '{point_count_abbreviated}',
                'text-size': 14
            },
			"paint": {
				"text-color": "white"
			}
        });

		// Add a layer showing the places.
		map.addLayer({
			'id': 'places',
			'type': 'symbol',
			'source': 'places',
			'filter': ['!', ['has', 'point_count']],
			'layout': {
				'icon-image': 'custom-marker',
				'icon-size': 0.23,
				'icon-anchor': 'bottom',
				'icon-overlap': 'always'
			}
		});

        // inspect a cluster on click
        map.on('click', 'clusters', async (e) => {
            const features = map.queryRenderedFeatures(e.point, {
                layers: ['clusters']
            });
            const clusterId = features[0].properties.cluster_id;
            const zoom = (await map.getSource('places').getClusterExpansionZoom(clusterId))+1;
			map.easeTo({
                center: features[0].geometry.coordinates,
                zoom
            });
        });

		// When a click event occurs on a feature in the places layer, open a popup at the
		// location of the feature, with description HTML from its properties.
		map.on('click', 'places', (e) => {
			const coordinates = e.features[0].geometry.coordinates.slice();
			const WD_id = e.features[0].properties.WD_id;
	    		
			// Get the most recent clip for a Wikidata id from NRDLclips
	     	if (!NRDLclips[WD_id]) {
        	  console.warn(`Geen clip gevonden voor ${WD_id}`);
        	  return;
    		}
	    	
	    	const latest = getLatestClip(NRDLclips[WD_id]);
	    	const SC_link = latest.SC_link;
	    	const SC_stfr = latest.SC_stfr;

			// Ensure that if the map is zoomed out such that multiple
			// copies of the feature are visible, the popup appears
			// over the copy being pointed to.
			while (Math.abs(e.lngLat.lng - coordinates[0]) > 180) {
				coordinates[0] += e.lngLat.lng > coordinates[0] ? 360 : -360;
			}            
			
			getWikiDataItem(WD_id, coordinates);
			
			var iframeElement = document.querySelector('iframe');
			var widget= SC.Widget(iframeElement);
			widget.load(SC_link, {'visual':'true'});
			widget.bind(SC.Widget.Events.READY,function(){ //When player is ready, attach an event
				widget.seekTo(SC_stfr);
			});
				
		});

		// Change the cursor to a pointer when the mouse is over the places or clusters layer.
		map.on('mouseenter', 'places', () => {
			map.getCanvas().style.cursor = 'pointer';
		});
		
		map.on('mouseenter', 'clusters', () => {
			map.getCanvas().style.cursor = 'pointer';
		});


		// Change it back to a pointer when it leaves.
		map.on('mouseleave', 'places', () => {
			map.getCanvas().style.cursor = '';
		});
		
		map.on('mouseleave', 'clusters', () => {
			map.getCanvas().style.cursor = '';
		});

	});
</script>

<iframe width="100%" height="140" scrolling="no" frameborder="no" src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/tracks/2069232792&visual=true"></iframe>

</body>
</html>
